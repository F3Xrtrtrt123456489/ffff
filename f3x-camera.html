<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F3X 合影</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, system-ui, "PingFang SC", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #stage { text-align: center; padding: 24px; width: 100%; max-width: 480px; }
  #art { font-family: "SF Mono", Menlo, Consolas, monospace; white-space: pre;
    font-size: clamp(10px, 3.4vw, 22px); line-height: 1.15; margin-bottom: 18px; }
  #status { font-size: 14px; color: #999; min-height: 20px; margin-bottom: 14px; }
  #camWrap { display: none; position: relative; border-radius: 16px; overflow: hidden;
    border: 1px solid #333; background: #111; }
  video { width: 100%; display: block; }
  canvas { display: none; }
  #count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.6); opacity: 0; transition: opacity .2s; }
  #result { display: none; margin-top: 16px; }
  #result img { width: 100%; border-radius: 16px; border: 1px solid #333; }
  .btn { background: #1f1f1f; color: #fff; border: 1px solid #444; border-radius: 10px;
    padding: 10px 20px; font-size: 14px; margin-top: 14px; }
  #dlNote { font-size: 12px; color: #777; margin-top: 8px; }
</style>
</head>
<body>
<div id="stage">
  <div id="art"></div>
  <div id="status">正在加载…</div>

  <div id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="count"></div>
  </div>
  <canvas id="canvas"></canvas>

  <div id="result">
    <img id="photo" alt="拍摄结果">
    <div id="dlNote">已尝试自动下载到本地</div>
  </div>

  <button class="btn" id="retry" style="display:none">再拍一张</button>
</div>

<script>
const rows = [
" _____  _____ __  __",
"|  ___||___ / \\ \\/ /",
"| |_     |_ \\  \\  / ",
"|  _|   ___) | /  \\ ",
"|_|    |____/ /_/\\_\\"
];

function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0)*255, f(8)*255, f(4)*255];
}

function paintArt() {
  const base = Math.random()*360;
  const stops = [];
  for (let i=0;i<4;i++){
    const h=(base+i*(60+Math.random()*50))%360;
    stops.push(hsl2rgb(h,80+Math.random()*15,58+Math.random()*8));
  }
  const art=document.getElementById('art');
  art.innerHTML='';
  rows.forEach((r,i)=>{
    const t=(i/(rows.length-1))*3;
    const s=Math.min(Math.floor(t),2), f=t-s;
    const c=stops[s].map((v,j)=>Math.round(v+(stops[s+1][j]-v)*f));
    const d=document.createElement('div');
    d.textContent=r;
    d.style.color=`rgb(${c})`;
    art.appendChild(d);
  });
}
paintArt();

const statusEl = document.getElementById('status');
const camWrap = document.getElementById('camWrap');
const video = document.getElementById('video');
const countEl = document.getElementById('count');
const canvas = document.getElementById('canvas');
const result = document.getElementById('result');
const photo = document.getElementById('photo');
const retry = document.getElementById('retry');

async function startCamera(){
  statusEl.textContent = '即将请求摄像头权限,用于拍一张合影';
  await new Promise(r=>setTimeout(r,1200));

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusEl.textContent = '当前页面不在安全环境(https/localhost)下,浏览器不允许调用摄像头';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    camWrap.style.display = 'block';
    statusEl.textContent = '摄像头已开启,看向镜头';
    await countdown(3);
    takePhoto(stream);
  } catch (err) {
    statusEl.textContent = '没有拿到摄像头权限(' + err.message + '),可刷新重试';
  }
}

function countdown(n){
  return new Promise(resolve=>{
    let i=n;
    countEl.style.opacity=1;
    const tick=()=>{
      countEl.textContent = i>0 ? i : '📸';
      if (i<=0){ setTimeout(()=>{countEl.style.opacity=0; resolve();},300); return; }
      i--; setTimeout(tick,800);
    };
    tick();
  });
}

function takePhoto(stream){
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  const dataUrl = canvas.toDataURL('image/png');
  photo.src = dataUrl;
  camWrap.style.display='none';
  result.style.display='block';
  statusEl.textContent = '拍好了 👇';
  retry.style.display='inline-block';

  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'f3x-photo-' + Date.now() + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();

  stream.getTracks().forEach(t=>t.stop());
}

retry.onclick = () => {
  result.style.display='none';
  retry.style.display='none';
  paintArt();
  startCamera();
};

setTimeout(startCamera, 1800);
</script>
</body>
</html>
